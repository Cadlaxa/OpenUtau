%YAML 1.2
---
version: 1.1
symbols:
  - {symbol: a, type: vowel}
  - {symbol: aa, type: vowel}
  - {symbol: ax, type: vowel}
  - {symbol: ae, type: vowel}
  - {symbol: ah, type: vowel}
  - {symbol: ao, type: vowel}
  - {symbol: aw, type: diphthong}
  - {symbol: ay, type: diphthong}
  - {symbol: b, type: stop}
  - {symbol: by, type: stop}
  - {symbol: bw, type: stop}
  - {symbol: ch, type: affricate}
  - {symbol: d, type: stop}
  - {symbol: dy, type: stop}
  - {symbol: dw, type: stop}
  - {symbol: dh, type: fricative}
  - {symbol: dx, type: tap}
  - {symbol: dr, type: affricate}
  - {symbol: e, type: vowel}
  - {symbol: eh, type: vowel}
  - {symbol: er, type: diphthong}
  - {symbol: ey, type: diphthong}
  - {symbol: f, type: fricative}
  - {symbol: g, type: stop}
  - {symbol: gy, type: stop}
  - {symbol: gw, type: stop}
  - {symbol: hh, type: aspirate}
  - {symbol: h, type: aspirate}
  - {symbol: hy, type: aspirate}
  - {symbol: hw, type: aspirate}
  - {symbol: i, type: vowel}
  - {symbol: ih, type: vowel}
  - {symbol: iy, type: diphthong}
  - {symbol: jh, type: affricate}
  - {symbol: j, type: affricate}
  - {symbol: jy, type: affricate}
  - {symbol: jw, type: affricate}
  - {symbol: k, type: stop}
  - {symbol: ky, type: stop}
  - {symbol: kw, type: stop}
  - {symbol: kr, type: stop}
  - {symbol: l, type: liquid}
  - {symbol: m, type: nasal}
  - {symbol: my, type: nasal}
  - {symbol: mw, type: nasal}
  - {symbol: n, type: nasal}
  - {symbol: ny, type: nasal}
  - {symbol: nw, type: nasal}
  - {symbol: ng, type: nasal}
  - {symbol: o, type: vowel}
  - {symbol: ow, type: diphthong}
  - {symbol: oy, type: diphthong}
  - {symbol: p, type: stop}
  - {symbol: py, type: stop}
  - {symbol: pw, type: stop}
  - {symbol: q, type: stop}
  - {symbol: vf, type: stop}
  - {symbol: r, type: liquid}
  - {symbol: ry, type: liquid}
  - {symbol: s, type: fricative}
  - {symbol: st, type: fricative}
  - {symbol: sh, type: fricative}
  - {symbol: t, type: stop}
  - {symbol: ts, type: stop}
  - {symbol: ty, type: stop}
  - {symbol: tw, type: stop}
  - {symbol: th, type: fricative}
  - {symbol: tr, type: affricate}
  - {symbol: u, type: vowel}
  - {symbol: uh, type: vowel}
  - {symbol: uw, type: diphthong}
  - {symbol: v, type: fricative}
  - {symbol: w, type: semivowel}
  - {symbol: y, type: semivowel}
  - {symbol: z, type: fricative}
  - {symbol: zh, type: fricative}
  - {symbol: N, type: vowel}

diphthongs:
# Default diphthong split is [V-] even without this section
# you can change them by editing this section.
  - {from: ay, to: ay-}
  - {from: ey, to: ey-}
  - {from: oy, to: oy-}
  - {from: aw, to: aw-}
  - {from: uw, to: w}
  - {from: ow, to: ow-}

replacements:
  - {from: hh, to: h}
  - {from: jh, to: j}
  - {from: aw, to: [a, w]}
  - {from: ow, to: [o, w]}
  - {from: ay, to: [a, y]}
  - {from: oy, to: [o, y]}
  - {from: ey, to: [e, y]}

timings:
# example entries, you can further customize each phoneme lengths in seconds
  - {symbol: l, value: 1.3}
  - {symbol: r, value: 0.7}

entries:
  - grapheme: openutau
    phonemes: [ow, p, e, n, u, t, a, u]
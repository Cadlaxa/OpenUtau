%YAML 1.2
---
version: 1.3
symbols:
  - {symbol: aa, type: vowel}
  - {symbol: ae, type: vowel}
  - {symbol: ah, type: vowel}
  - {symbol: ao, type: vowel}
  - {symbol: aw, type: vowel}
  - {symbol: ay, type: vowel}
  - {symbol: b, type: stop}
  - {symbol: ch, type: affricate}
  - {symbol: d, type: stop}
  - {symbol: dh, type: fricative}
  - {symbol: eh, type: vowel}
  - {symbol: er, type: vowel}
  - {symbol: ey, type: vowel}
  - {symbol: f, type: fricative}
  - {symbol: g, type: stop}
  - {symbol: hh, type: aspirate}
  - {symbol: ih, type: vowel}
  - {symbol: iy, type: vowel}
  - {symbol: jh, type: affricate}
  - {symbol: k, type: stop}
  - {symbol: l, type: liquid}
  - {symbol: m, type: nasal}
  - {symbol: n, type: nasal}
  - {symbol: ng, type: nasal}
  - {symbol: ow, type: vowel}
  - {symbol: oy, type: vowel}
  - {symbol: p, type: stop}
  - {symbol: r, type: liquid}
  - {symbol: s, type: fricative}
  - {symbol: sh, type: fricative}
  - {symbol: t, type: stop}
  - {symbol: th, type: fricative}
  - {symbol: uh, type: vowel}
  - {symbol: uw, type: vowel}
  - {symbol: v, type: fricative}
  - {symbol: w, type: semivowel}
  - {symbol: y, type: semivowel}
  - {symbol: z, type: fricative}
  - {symbol: zh, type: fricative}
  - {symbol: eu, type: vowel}
  - {symbol: '@', type: vowel}
  - {symbol: a, type: vowel}
  - {symbol: e, type: vowel}
  - {symbol: i, type: vowel}
  - {symbol: o, type: vowel}
  - {symbol: u, type: vowel}
  - {symbol: U, type: semivowel}
  - {symbol: I, type: semivowel}

replacements:
  - {from: aa, to: [aw]}
  - {from: [aa, r], to: [a, 3]}
  - {from: [aa, l], to: [aw, ll]}
  - {from: ae, to: ['@']}
  - {from: ao, to: [aw]}
  - {from: ah, to: [uh]}
  - {from: ax, to: [uh]}
  - {from: [ax, n], to: [ih, n]}
  - {from: [ax, m], to: [ih, m]}
  - {from: [ax, ng], to: [ih, ng]}
  - {from: ay, to: [a, I]}
  - {from: aw, to: ['@', U]}
  - {from: ax, to: [eu, ll]}
  - {from: dh, to: [th]}
  - {from: dr, to: [d, 3]}
  - {from: dx, to: [r]}
  - {from: eh, to: [e]}
  - {from: er, to: [er]}
  - {from: ey, to: [e, I]}
  - {from: hh, to: [h]}
  - {from: ih, to: [ih]}
  - {from: iy, to: [i]}
  - {from: jh, to: [j]}
  - {from: k, to: [kk]}
  - {from: l, to: [ll]}
  - {from: ng, to: [ng]}
  - {from: oy, to: [o, I]}
  - {from: ow, to: [o, U]}
  - {from: p, to: [pp]}
  - {from: r, to: [3]}
  - {from: [s, t], to: [st]}
  - {from: t, to: [tt]}
  - {from: th, to: [th]}
  - {from: tr, to: [tt, 3]}
  - {from: [t, s], to: [ts]}
  - {from: uh, to: [eu]}
  - {from: uw, to: [u]}
  - {from: v, to: [v]}
  - {from: zh, to: [zh]}
  - {from: [t, s], to: [ts], where: all}
  - {from: [tt, s], to: [ts], where: all}
  - {from: [d, z], to: [dz]}
  - {from: [ao, r], to: [o, 3]}
  - {from: [l, l], to: [ll], where: all}
  - {from: [ao, l], to: [o, ll]}
  - {from: [n, s], to: [n, ts]}
  - {from: [n, d, z], to: [n, z]}

fallbacks:
  - {from: U, to: u}
  - {from: I, to: i}
  - {from: tt, to: t}
  - {from: kk, to: k}
  - {from: pp, to: p}
  - {from: ng, to: n}
  - {from: ll, to: l}
entries:
  - grapheme: openutau
    phonemes: [ow, p, ah, n, uw, t, aw]
  - grapheme: around
    phonemes: [ah, r, aw, n, d]
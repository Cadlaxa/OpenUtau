%YAML 1.2
---
version: 1.3.1
symbols:
  - {symbol: aa, type: vowel}
  - {symbol: ae, type: vowel}
  - {symbol: ah, type: vowel}
  - {symbol: ao, type: vowel}
  - {symbol: aw, type: vowel}
  - {symbol: ay, type: vowel}
  - {symbol: b, type: stop}
  - {symbol: ch, type: affricate}
  - {symbol: d, type: stop}
  - {symbol: dh, type: fricative}
  - {symbol: eh, type: vowel}
  - {symbol: er, type: vowel}
  - {symbol: ey, type: vowel}
  - {symbol: f, type: fricative}
  - {symbol: g, type: stop}
  - {symbol: hh, type: aspirate}
  - {symbol: ih, type: vowel}
  - {symbol: iy, type: vowel}
  - {symbol: jh, type: affricate}
  - {symbol: k, type: stop}
  - {symbol: l, type: liquid}
  - {symbol: m, type: nasal}
  - {symbol: n, type: nasal}
  - {symbol: ng, type: nasal}
  - {symbol: ow, type: vowel}
  - {symbol: oy, type: vowel}
  - {symbol: p, type: stop}
  - {symbol: r, type: liquid}
  - {symbol: s, type: fricative}
  - {symbol: sh, type: fricative}
  - {symbol: t, type: stop}
  - {symbol: th, type: fricative}
  - {symbol: uh, type: vowel}
  - {symbol: uw, type: vowel}
  - {symbol: v, type: fricative}
  - {symbol: w, type: semivowel}
  - {symbol: y, type: semivowel}
  - {symbol: z, type: fricative}
  - {symbol: zh, type: fricative}
  - {symbol: eu, type: vowel}
  - {symbol: '@', type: vowel}
  - {symbol: a, type: vowel}
  - {symbol: e, type: vowel}
  - {symbol: i, type: vowel}
  - {symbol: o, type: vowel}
  - {symbol: u, type: vowel}

replacements:
  - {from: aa, to: [aw]}
  - {from: ae, to: ['@']}
  - {from: ao, to: [aw]}
  - {from: aw, to: [a, U]}
  - {from: ah, to: [uh]}
  - {from: ax, to: [eu]}
  - {from: ay, to: [a, I]}
  - {from: dh, to: [th]}
  - {from: dr, to: [d, 3]}
  - {from: dx, to: [r]}
  - {from: eh, to: [e]}
  - {from: er, to: [er]}
  - {from: ey, to: [e, I]}
  - {from: hh, to: [h]}
  - {from: ih, to: [e]}
  - {from: iy, to: [i]}
  - {from: jh, to: [j]}
  - {from: k, to: [kk]}
  - {from: l, to: [l]}
  - {from: ng, to: [ng]}
  - {from: ow, to: [o, U]}
  - {from: oy, to: [o, Y]}
  - {from: q, to: ['-']}
  - {from: r, to: [3]}
  - {from: t, to: [tt]}
  - {from: th, to: [th]}
  - {from: [th, r], to: [ts, 3]}
  - {from: tr, to: [ch, 3]}
  - {from: ts, to: [ts]}
  - {from: uh, to: [u]}
  - {from: uw, to: [u]}
  - {from: v, to: [v]}
  - {from: zh, to: [zh]}

fallbacks:
  - {from: Y, to: i}
  - {from: U, to: u}
entries:
  - grapheme: openutau
    phonemes: [ow, p, ah, n, uw, t, aw]
  - {from: ["null", irr], to: ["null", e1], where: all}
  - {from: ["null", ao], to: ["null", o1], where: all}
  - {from: ["null", uw], to: ["null", u1], where: all}
  - {from: ["null", uh], to: ["null", u1], where: all}
  - {from: ["null", ay], to: ["null", ai1], where: all}

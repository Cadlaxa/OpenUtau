replacements:
  # Contextual ax / ea / ia rules
  - {from: [ax, "nasal"], to: [e, "nasal"]}
  - {from: [ax, l], to: [ao, l]}
  - {from: [dx, ax, l], to: [4, aa, l]}
  - {from: ["consonants=p,b,d,g,t", ax], to: ["consonants=p,b,d,g,t", ao]}
  - {from: ["consonant", ax, "consonants=s,z,d,t,jh,ch"], to: ["consonant", e, "consonants=s,z,d,t,jh,ch"]}
  - {from: [ae, "nasal"], to: [ea, "nasal"]}
  - {from: ["consonants", ih, "nasal!ng"], to: ["consonants", ia, "nasal!ng"]}
  - {from: [ih, "nasal!ng"], to: [ia, "nasal!ng"]}

  # Affricate & Fricative Conditionals
  - {from: ["fricative", t, "vowel"], to: ["fricative", t, "vowel"]}
  - {from: [t, "vowel"], to: [ts, "vowel"], where: all}

  # Vowel Normalization
  - {from: aa, to: a}
  - {from: eh, to: e}
  - {from: iy, to: i}
  - {from: o, to: ao}
  - {from: uw, to: u}
  - {from: dx, to: 4}

  # Boundary Rules
  - {from: [n, 4], to: n, where: boundary}
  - {from: ["consonants=s,z,t", ih], to: ["consonants=s,z,t", e], where: all}
  - {from: ["consonants=s,z", iy], to: ["consonants=s,z", i], where: all}

  # Inter-Vowel Glides & Transitions
  - {from: ["vowel=er,ar,air,ir,irr,or,ur,urr", iy], to: ["vowel=er,ar,air,ir,irr,or,ur,urr", r, i], where: all}
  - {from: ["vowel=er,ar,air,ir,irr,or,ur,urr", "vowel=ih,e"], to: ["vowel=er,ar,air,ir,irr,or,ur,urr", r, e], where: all}
  - {from: [i, "vowel"], to: [i, y, "vowel"], where: all}
  - {from: [u, "vowel"], to: [u, w, "vowel"], where: all}
  - {from: [aw, "vowel"], to: [aw, w, "vowel"], where: all}
  - {from: [ow, "vowel"], to: [ow, w, "vowel"], where: all}

  # Fake Rhotic
  - {from: [aa, r], to: [ar], where: all}
  - {from: [eh, r], to: [air], where: all}
  - {from: [ih, r], to: [irr], where: all}
  - {from: [iy, r], to: [ir], where: all}
  - {from: [ao, r], to: [or], where: all}
  - {from: [uh, r], to: [urr], where: all}
  - {from: [uw, r], to: [ur], where: all}

  # Starting Vowels
  - {from: ["null", aa], to: ["null", a1], where: all}
  - {from: ["null", ar], to: ["null", a1], where: all}
  - {from: ["null", a], to: ["null", a1], where: all}
  - {from: ["null", eh], to: ["null", e1], where: all}

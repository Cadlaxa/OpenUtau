%YAML 1.2
---
version: 1.7
symbols:
  - {symbol: a, type: vowel}
  - {symbol: aa, type: vowel}
  - {symbol: ax, type: vowel}
  - {symbol: ae, type: vowel}
  - {symbol: ah, type: vowel}
  - {symbol: ao, type: vowel}
  - {symbol: aw, type: diphthong}
  - {symbol: ay, type: diphthong}
  - {symbol: cc, type: aspirant}
  - {symbol: b, type: stop}
  - {symbol: by, type: stop}
  - {symbol: bw, type: stop}
  - {symbol: ch, type: affricate}
  - {symbol: d, type: stop}
  - {symbol: dy, type: stop}
  - {symbol: dw, type: stop}
  - {symbol: dh, type: fricative}
  - {symbol: dx, type: tap}
  - {symbol: dr, type: affricate}
  - {symbol: e, type: vowel}
  - {symbol: eh, type: vowel}
  - {symbol: er, type: vowel}
  - {symbol: ey, type: diphthong}
  - {symbol: f, type: fricative}
  - {symbol: g, type: stop}
  - {symbol: gy, type: stop}
  - {symbol: gw, type: stop}
  - {symbol: hh, type: aspirate}
  - {symbol: h, type: aspirate}
  - {symbol: hy, type: stop}
  - {symbol: hj, type: aspirate}
  - {symbol: hw, type: aspirate}
  - {symbol: i, type: vowel}
  - {symbol: ih, type: vowel}
  - {symbol: iy, type: vowel}
  - {symbol: ii, type: vowel}
  - {symbol: jh, type: affricate}
  - {symbol: j, type: affricate}
  - {symbol: jy, type: affricate}
  - {symbol: jw, type: affricate}
  - {symbol: k, type: stop}
  - {symbol: ky, type: stop}
  - {symbol: kw, type: stop}
  - {symbol: kr, type: stop}
  - {symbol: l, type: liquid}
  - {symbol: m, type: nasal}
  - {symbol: my, type: nasal}
  - {symbol: mw, type: nasal}
  - {symbol: n, type: nasal}
  - {symbol: ny, type: nasal}
  - {symbol: nw, type: nasal}
  - {symbol: ng, type: nasal}
  - {symbol: o, type: vowel}
  - {symbol: ow, type: vowel}
  - {symbol: ox, type: vowel}
  - {symbol: oe, type: vowel}
  - {symbol: ooh, type: vowel}
  - {symbol: oy, type: diphthong}
  - {symbol: p, type: stop}
  - {symbol: py, type: stop}
  - {symbol: pw, type: stop}
  - {symbol: q, type: stop}
  - {symbol: vf, type: stop}
  - {symbol: r, type: liquid}
  - {symbol: ry, type: liquid}
  - {symbol: s, type: fricative}
  - {symbol: st, type: fricative}
  - {symbol: sh, type: fricative}
  - {symbol: t, type: stop}
  - {symbol: ts, type: stop}
  - {symbol: ty, type: stop}
  - {symbol: tw, type: stop}
  - {symbol: th, type: fricative}
  - {symbol: tr, type: affricate}
  - {symbol: u, type: vowel}
  - {symbol: ww, type: vowel}
  - {symbol: ux, type: vowel}
  - {symbol: uh, type: vowel}
  - {symbol: uw, type: vowel}
  - {symbol: v, type: fricative}
  - {symbol: w, type: semivowel}
  - {symbol: ex, type: vowel}
  - {symbol: xe, type: stop}
  - {symbol: y, type: semivowel}
  - {symbol: yy, type: vowel}
  - {symbol: z, type: fricative}
  - {symbol: zh, type: fricative}

diphthongs:
# Default diphthong split is [V-] even without this section
# you can change them by editing this section.
  - {from: ay, to: ay-}
  - {from: ey, to: ey-}
  - {from: oy, to: oy-}
  - {from: aw, to: aw-}
  - {from: uw, to: w}
  - {from: ow, to: ow-}

replacements:
  - {from: cc, to: hj}
  - {from: ee, to: iy}
  - {from: ex, to: ex}
  - {from: [aa, xe], to: [aa]}
  - {from: [ah, xe], to: ah}
  - {from: [ax, n], to: [eh, n]}
  - {from: [ax, m], to: [eh, m]}
  - {from: oe, to: ox}
  - {from: ohh, to: ao}
  - {from: ooh, to: o}
  - {from: pf, to: [p, f]}
  - {from: rr, to: r1}
  - {from: ts, to: [t, s]}
  - {from: ue, to: ux}
  - {from: x, to: hj}
  - {from: yy, to: ux}
  - {from: uw, to: ww}
  - {from: q, to: vtrash}

fallbacks:
  - {from: xe, to: ax}
  - {from: ex, to: ah}
  - {from: ooh, to: ow}
  - {from: o, to: ow}
  - {from: ww, to: u}

entries:
  - grapheme: a
    phonemes: [ah]
  - grapheme: wir
    phonemes: [v, iy, ex]
  - grapheme: mehr
    phonemes: [m, eh, ex]
  - grapheme: zu
    phonemes: [z, uw]
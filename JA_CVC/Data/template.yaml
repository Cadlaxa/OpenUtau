  - {symbol: w, type: semivowel}
  - {symbol: y, type: semivowel}
  - {symbol: z, type: fricative}
  - {symbol: zh, type: fricative}

# the N used as [ん]
  - {symbol: ん, type: vowel}

# vowels that for other languages
  - {symbol: I, type: vowel}
  - {symbol: '{', type: vowel}
  - {symbol: V, type: vowel}
  - {symbol: U, type: vowel}
  - {symbol: '3', type: vowel}

# Basic+
  - {symbol: aI, type: vowel}
  - {symbol: aU, type: vowel}
  - {symbol: eI, type: vowel}
  - {symbol: OI, type: vowel}
  - {symbol: oU, type: vowel}

# extended
  - {symbol: dd, type: tap}
  - {symbol: dz, type: affricate}
  - {symbol: kh, type: fricative}
  - {symbol: kk, type: stop}
  - {symbol: pp, type: stop}
  - {symbol: rh, type: liquid}
  - {symbol: tt, type: stop}

# if you record extras
  - {symbol: '・', type: stop}
  - {symbol: "'", type: stop}

replacements:
  - {from: dz, to: [d, z]}

timings:
# example entries, you can further customize each phoneme lengths in seconds
  - {symbol: l, value: 1.3}
  - {symbol: r, value: 0.7}


  - {from: ["vowel=ua", n], to: [UU, a, n]}
  - {from: ["vowel=u@", n], to: [UU, e, n]}
  - {from: ui, to: [UU, Ei]}
  - {from: un, to: [v, n]}
  - {from: uo, to: [UU, o]}
  - {from: v, to: v}
  - {from: w, to: w}
  - {from: x, to: x}
  - {from: y, to: y}
  - {from: z, to: z}


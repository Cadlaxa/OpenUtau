  - {symbol: I, type: vowel}
  - {symbol: 1, type: vowel}
  - {symbol: u, type: vowel}
  - {symbol: v, type: vowel}
  - {symbol: b, type: stop}
  - {symbol: ch, type: affricate}
  - {symbol: d, type: stop}
  - {symbol: f, type: fricative}
  - {symbol: g, type: stop}
  - {symbol: h, type: aspirate}
  - {symbol: j, type: affricate}
  - {symbol: zh, type: affricate}

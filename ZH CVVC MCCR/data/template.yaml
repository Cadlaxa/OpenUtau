  - {symbol: y, type: semivowel}
  - {symbol: z, type: affricate}
  - {symbol: c, type: affricate}
  # pinyin vowels
  - {symbol: ai, type: vowel}
  - {symbol: ei, type: vowel}
  - {symbol: ao, type: vowel}
  - {symbol: ou, type: vowel}
  - {symbol: ia, type: vowel}
  - {symbol: ie, type: vowel}

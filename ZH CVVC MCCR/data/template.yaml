  - {symbol: iu, type: vowel}
  - {symbol: ua, type: vowel}
  - {symbol: uo, type: vowel}
  - {symbol: uai, type: vowel}
  - {symbol: ui, type: vowel}
  - {symbol: ve, type: vowel}
  - {symbol: er, type: vowel}
  # Front Nasal Vowels (Ending in -n)
  - {symbol: an, type: vowel}
  - {symbol: en, type: vowel}
  - {symbol: in, type: vowel}
  - {symbol: un, type: vowel}
  - {symbol: vn, type: vowel}
  - {symbol: ian, type: vowel}
  - {symbol: uan, type: vowel}
  - {symbol: van, type: vowel}
  # Back Nasal Vowels (Ending in -ng)
  - {symbol: ang, type: vowel}
  - {symbol: eng, type: vowel}
  - {symbol: ing, type: vowel}
  - {symbol: ong, type: vowel}
  - {symbol: iang, type: vowel}
  - {symbol: iong, type: vowel}
  - {symbol: uang, type: vowel}
  - {symbol: ueng, type: vowel}
  # split semivowels
  - {symbol: II, type: semivowel}
  - {symbol: OO, type: semivowel}
  - {symbol: AA, type: semivowel}
  - {symbol: EE, type: semivowel}
  - {symbol: ee, type: semivowel}
  - {symbol: EEi, type: semivowel}
  - {symbol: UU, type: semivowel}
  - {symbol: VV, type: semivowel}
  - {symbol: R, type: tail}

replacements:
  - {from: a, to: a}
  - {from: ai, to: [a, II]}
  - {from: an, to: [a, n]}
  - {from: ang, to: [a, ng]}
  - {from: ao, to: [a, OO]}
  - {from: [a, r], to: [a, r]}
  - {from: b, to: b}
  - {from: c, to: c}
  - {from: ch, to: ch}
  - {from: d, to: d}
  - {from: ei, to: [ee, Ei]}
  - {from: e, to: e}
  - {from: en, to: [e, n]}
  - {from: eng, to: [e, ng]}
  - {from: f, to: f}
  - {from: g, to: g}
  - {from: zh, to: zh}
  - {from: h, to: h}
  - {from: h-i, to: "1"}
  - {from: -i, to: "1"}
  - {from: i, to: i}
  - {from: ia, to: [II, a]}
  - {from: ian, to: [II, E, n]}
  - {from: iang, to: [II, a, ng]}
  - {from: iao, to: [II, a, OO]}
  - {from: ie, to: [II, E]}
  - {from: in, to: [i, n]}
  - {from: ing, to: [i, ng]}
  - {from: iong, to: [II, o, ng]}
  - {from: iu, to: [II, o]}
  - {from: j, to: j}
  - {from: k, to: k}
  - {from: l, to: l}
  - {from: m, to: m}
  - {from: n, to: n}
  - {from: ny, to: [n, y]}
  - {from: o, to: o}
  - {from: ou, to: [o, UU]}
  - {from: ong, to: [o, ng]}
  - {from: p, to: p}
  - {from: q, to: q}
  - {from: r, to: r}
  - {from: r1, to: l}
  - {from: s, to: s}
  - {from: sh, to: sh}
  - {from: t, to: t}
  - {from: u, to: u}
  - {from: ua, to: [UU, a]}
  - {from: uai, to: [UU, a, II]}
  - {from: uan, to: [VV, i, EE, n]}
  - {from: uang, to: [v, II, EE, ng]}
  - {from: ue, to: [v, EE]}
  - {from: ui, to: [UU, Ei]}
  - {from: un, to: [v, n]}
  - {from: uo, to: [UU, o]}
  - {from: v, to: v}
  - {from: w, to: w}
  - {from: x, to: x}
  - {from: y, to: y}
  - {from: z, to: z}

fallbacks:
  - {from: II, to: i}
  - {from: OO, to: o}
  - {from: AA, to: a}
  - {from: EE, to: E}
  - {from: ee, to: e}
  - {from: EEi, to: Ei}
  - {from: UU, to: u}
  - {from: VV, to: v}
  - {from: Ei, to: i}
  - {from: " i", to: i}
  - {from: "o ", to: o}
  - {from: " a", to: a}
  - {from: " E", to: E}
  - {from: " e", to: e}
  - {from: " Ei", to: Ei}
  - {from: " u", to: u}
  - {from: " v", to: v}
  - {from: R, to: "-"}

timings:
  # glide timings
  - {symbol: "i a", value: 0.8}
  - {symbol: "i e", value: 0.8}
  - {symbol: "i E", value: 0.8}
  - {symbol: "i o", value: 0.8}
  - {symbol: "u o", value: 0.8}
  - {symbol: "u a", value: 0.8}
  - {symbol: "v E", value: 0.8}
  - {symbol: "v i", value: 0.8}
  - {symbol: "u Ei", value: 0.8}
  - {symbol: "e Ei", value: 0.8}

entries:
  - {grapheme: a, phonemes: [a]}
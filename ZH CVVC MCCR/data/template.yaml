  - {symbol: II, type: semivowel}
  - {symbol: OO, type: semivowel}
  - {symbol: AA, type: semivowel}
  - {symbol: EE, type: semivowel}
  - {symbol: ee, type: semivowel}
  - {symbol: EEi, type: semivowel}
  - {symbol: UU, type: semivowel}
  - {symbol: VV, type: semivowel}
  - {symbol: R, type: tail}

fallbacks:
  - {from: II, to: i}
  - {from: I, to: "1"}
  - {from: OO, to: o}
  - {from: AA, to: a}
  - {from: EE, to: E}
  - {from: ee, to: e}
  - {from: EEi, to: Ei}
  - {from: UU, to: u}
  - {from: VV, to: v}
  - {from: Ei, to: i}
  - {from: R, to: "-"}
  
timings:
  # glide timings
  - {symbol: "i a", value: 0.8}
  - {symbol: "i e", value: 0.8}
  - {symbol: "i E", value: 0.8}
  - {symbol: "i o", value: 1.2}
  - {symbol: "u o", value: 1.2}
  - {symbol: "u a", value: 1.2}
  - {symbol: "u e", value: 1.2}
  - {symbol: "v E", value: 0.8}
  - {symbol: "v E", value: 0.8}
  - {symbol: "v i", value: 0.8}
  - {symbol: "u Ei", value: 1.2}
  - {symbol: "e Ei", value: 0.4}
  - {symbol: "a -", value: 1.3}
  - {symbol: "e -", value: 1.3}
  - {symbol: "i -", value: 1.3}
  - {symbol: "o -", value: 1.3}
  - {symbol: "u -", value: 1.3}
  - {symbol: n, value: 1.6}
  - {symbol: ng, value: 1.6}

replacements:
  - {from: ["null", "consonants"], to: ["null", "-", "consonants"], where: all}
  - {from: a, to: a}
  - {from: ai, to: [a, II]}
  - {from: an, to: [a, n]}
  - {from: ang, to: [a, ng]}
  - {from: "vowel=ao,AU", to: [a, OO]}
  - {from: [r, "null"], to: ["3", "null"], where: all}
  - {from: b, to: b}
  - {from: c, to: c}
  - {from: ch, to: ch}
  - {from: d, to: d}
  - {from: ei, to: [ee, Ei]}
  - {from: "vowel=e,@,7", to: e}
  - {from: en, to: [e, n]}
  - {from: eng, to: [e, ng]}
  - {from: f, to: f}
  - {from: g, to: g}
  - {from: zh, to: zh}
  - {from: h, to: h}
  - {from: h-i, to: "1"}
  - {from: i`, to: I}
  - {from: i, to: i}
  - {from: "vowel=ia,iA", to: [II, a]}
  - {from: ian, to: [II, E, n]}
  - {from: iang, to: [II, a, ng]}
  - {from: "vowel=iao,iAU", to: [II, a, OO]}
  - {from: ie, to: [II, E]}
  - {from: "vowel=y{", to: [VV, E]}
  - {from: in, to: [i, n]}
  - {from: ing, to: [i, ng]}
  - {from: iong, to: [II, o, ng]}
  - {from: "vowel=iu,iU", to: [II, o]}
  - {from: "vowel=iou,i@U", to: [II, o, UU]}
  - {from: j, to: j}
  - {from: k, to: k}
  - {from: l, to: l}
  - {from: m, to: m}
  - {from: n, to: n}

  - {from: ong, to: [o, ng]}
  - {from: p, to: p}
  - {from: q, to: q}
  - {from: r, to: r}
  - {from: r1, to: l}
  - {from: s, to: s}
  - {from: sh, to: sh}
  - {from: t, to: t}
  - {from: u, to: u}
  - {from: "vowel=uA,ua", to: [UU, a]}
  - {from: uai, to: [UU, a, II]}
  - {from: "vowel=uan,u@n", to: [UU, a, n]}
  - {from: uang, to: [UU, a, ng]}

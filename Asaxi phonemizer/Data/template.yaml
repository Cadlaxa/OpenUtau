  - {symbol: ś, type: fricative}
  - {symbol: c, type: fricative}
  - {symbol: dz, type: affricate}
  - {symbol: ń, type: nasal}
  - {symbol: "'", type: stop}
  - {symbol: ý, type: vowel}
  - {symbol: ù, type: vowel}
  - {symbol: á, type: vowel}
  - {symbol: ů, type: vowel}
  - {symbol: å, type: vowel}
  - {symbol: å1, type: vowel}
  - {symbol: ă, type: vowel}
  - {symbol: ă1, type: vowel}
  - {symbol: è, type: vowel}
  - {symbol: ë, type: vowel}
  - {symbol: ë1, type: vowel}
  - {symbol: ỏ, type: vowel}
  - {symbol: ỏ1, type: vowel}
  - {symbol: ő, type: vowel}
  - {symbol: ő1, type: vowel}
  - {symbol: nn, type: vowel}
  - {symbol: mm, type: vowel}
  - {symbol: nŋ, type: vowel}
  - {symbol: xn, type: vowel}
#Arpasing + Japanese
  - {symbol: a, type: vowel}
  - {symbol: aa, type: vowel}
  - {symbol: ax, type: vowel}
  - {symbol: ae, type: vowel}
  - {symbol: ah, type: vowel}
  - {symbol: ao, type: vowel}
  - {symbol: aw, type: vowel}
  - {symbol: ay, type: vowel}
  - {symbol: b, type: stop}
  - {symbol: by, type: stop}
  - {symbol: bw, type: stop}
  - {symbol: ch, type: affricate}
  - {symbol: d, type: stop}
  - {symbol: dy, type: stop}
  - {symbol: dw, type: stop}
  - {symbol: dh, type: fricative}
  - {symbol: dx, type: tap}
  - {symbol: dr, type: affricate}
  - {symbol: e, type: vowel}
  - {symbol: eh, type: vowel}
  - {symbol: er, type: vowel}
  - {symbol: ey, type: vowel}
  - {symbol: f, type: fricative}
  - {symbol: g, type: stop}
  - {symbol: gy, type: stop}
  - {symbol: gw, type: stop}
  - {symbol: hh, type: aspirate}
  - {symbol: h, type: aspirate}
  - {symbol: hy, type: aspirate}
  - {symbol: hw, type: aspirate}
  - {symbol: i, type: vowel}
  - {symbol: ih, type: vowel}
  - {symbol: iy, type: vowel}
  - {symbol: jh, type: affricate}
  - {symbol: j, type: affricate}
  - {symbol: jy, type: affricate}
  - {symbol: jw, type: affricate}
  - {symbol: k, type: stop}
  - {symbol: ky, type: stop}
  - {symbol: kw, type: stop}
  - {symbol: kr, type: stop}
  - {symbol: l, type: liquid}
  - {symbol: m, type: nasal}
  - {symbol: my, type: nasal}
  - {symbol: mw, type: nasal}
  - {symbol: n, type: nasal}
  - {symbol: ny, type: nasal}
  - {symbol: nw, type: nasal}
  - {symbol: ng, type: nasal}
  - {symbol: o, type: vowel}
  - {symbol: ow, type: vowel}
  - {symbol: oy, type: vowel}
  - {symbol: p, type: stop}
  - {symbol: py, type: stop}
  - {symbol: pw, type: stop}
  - {symbol: q, type: stop}
  - {symbol: vf, type: stop}
  - {symbol: r, type: liquid}
  - {symbol: ry, type: liquid}
  - {symbol: s, type: fricative}
  - {symbol: st, type: fricative}
  - {symbol: sh, type: fricative}
  - {symbol: t, type: stop}
  - {symbol: ts, type: stop}
  - {symbol: ty, type: stop}
  - {symbol: tw, type: stop}
  - {symbol: th, type: fricative}
  - {symbol: tr, type: affricate}
  - {symbol: u, type: vowel}
  - {symbol: uh, type: vowel}
  - {symbol: uw, type: vowel}
  - {symbol: v, type: fricative}
  - {symbol: w, type: semivowel}
  - {symbol: y, type: semivowel}
  - {symbol: z, type: fricative}
  - {symbol: zh, type: fricative}
  #inhale (breath)
  - {symbol: inh, type: vowel}
  #silence, used before breaths and in some special cases, the sample is simply -inf
  - {symbol: sil, type: consonant}
  #exhalation, use for expressive passages
  - {symbol: exh, type: consonant}
  #held stop (eg in. cat [cl] told)
  - {symbol: cl, type: stop}

replacements:
  - {from: å, to: [a, w]}
  - {from: ă, to: [a, y]}
  - {from: ë, to: [e, y]}
  - {from: ỏ, to: [o, w]}
  - {from: ő, to: [o, y]}
  - {from: shi, to: [sh, i]}
  - {from: ['#s'], to: [t, s]} # split ts
  - {from: [nn, sh], to: [xn, sh]}
  - {from: [nn, zh], to: [xn, zh]}
  - {from: [nn, ts], to: [xn, ts]}
  - {from: [nn, dz], to: [xn, dz]}
  - {from: [nn, f], to: [xn, f]}
  - {from: [nn, h], to: [xn, h]}
  - {from: [nn, hy], to: [xn, hy]}
  - {from: [nn, hw], to: [xn, hw]}
  - {from: [nn, p], to: [xn, p]}
  - {from: [nn, py], to: [xn, py]}
  - {from: [nn, pw], to: [xn, pw]}
  - {from: [nn, s], to: [xn, s]}
  - {from: [nn, w], to: [xn, w]}
  - {from: [nn, y], to: [xn, y]}

timings:
# example entries, you can further customize each phoneme lengths in seconds
  - {symbol: b, value: 1.15}
  - {symbol: by, value: 1.15}
  - {symbol: ch, value: 1.55}
  - {symbol: d, value: 1.0}
  - {symbol: dy, value: 1.0}
  - {symbol: dh, value: 1.08}
  - {symbol: dx, value: 0.70}
  - {symbol: dxy, value: 0.70}
  - {symbol: f, value: 1.25}
  - {symbol: fy, value: 1.25}
  - {symbol: g, value: 1.1}
  - {symbol: gy, value: 1.1}
  - {symbol: hh, value: 1.35}
  - {symbol: h, value: 0.95}
  - {symbol: hy, value: 0.95}
  - {symbol: jh, value: 1.15}
  - {symbol: k, value: 1.4}
  - {symbol: ky, value: 1.4}
  - {symbol: l, value: 1.3}
  - {symbol: ly, value: 1.3}
  - {symbol: m, value: 0.75}
  - {symbol: my, value: 0.75}
  - {symbol: n, value: 0.83}
  - {symbol: ny, value: 0.83}
  - {symbol: ng, value: 0.83}
  - {symbol: ngy, value: 0.83}
  - {symbol: p, value: 1.7}
  - {symbol: py, value: 1.7}
  - {symbol: r, value: 1.6}
  - {symbol: ry, value: 1.6}
  - {symbol: s, value: 1.4}
  - {symbol: sh, value: 1.4}
  - {symbol: t, value: 1.3}
  - {symbol: ty, value: 1.3}
  - {symbol: th, value: 1.75}
  - {symbol: v, value: 0.8}
  - {symbol: vy, value: 0.8}
  - {symbol: w, value: 1.0}
  - {symbol: y, value: 1.25}
  - {symbol: z, value: 1.5}
  - {symbol: zh, value: 1.0}
  - {symbol: ts, value: 1.68}
  - {symbol: dz, value: 1.42}
  - {symbol: q, value: 1.68}

entries:
  - grapheme: openutau
    phonemes: [ow, p, ax, n, u, t, a, u]
  - grapheme: cl
    phonemes: [cl]  
  - grapheme: ap
    phonemes: [exh, inh]
  - grapheme: sp
    phonemes: [sil, sil]
  - grapheme: vf
    phonemes: [q]
  - grapheme: exh
    phonemes: [exh, sil]    
# Breaths and stuff (wik)
  - grapheme: hh
    phonemes: [exh, sil]
  - grapheme: br
    phonemes: [sil, inh]  #use before phrases
  - grapheme: br1
    phonemes: [sil, inh]
  - grapheme: br2
    phonemes: [sil, inh]
  - grapheme: BR
    phonemes: [sil, inh]
  - grapheme: rb          #use in the middle of phrases
    phonemes: [exh, inh]
  - grapheme: RB
    phonemes: [exh, inh]
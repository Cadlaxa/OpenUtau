#breathes
  - {symbol: "ex", type: exhale}
  - {symbol: "EX", type: exhale}
  - {symbol: "in", type: inhale}
  - {symbol: "IN", type: inhale}

#Extended Vowels
  - {symbol: "9", type: vowel}
  - {symbol: x, type: vowel}
#consonants as vowel
  - {symbol: L, type: liquid}
  - {symbol: M, type: nasal}
  - {symbol: N, type: nasal}

#consonants carried
  - {symbol: "~", type: fricative}

#bonus symbols
# Japanese [N]
  - {symbol: "ん", type: vowel} 
#Korean
  - {symbol: A, type: vowel}
  - {symbol: bb, type: stop}
  - {symbol: gg, type: stop}
  - {symbol: jj, type: affricate}
  - {symbol: ss, type: fricative}
#Russian
  - {symbol: Y, type: vowel}

replacements:
#for Basic, Basic+
  - {from: [d, z], to: dz}
#the same note
  - {from: [s, f], to: sf}
  - {from: [s, ff], to: sf}
  - {from: [s, k], to: sk}
  - {from: [s, kk], to: sk}
  - {from: [sh, kk], to: [sh, k]}
  - {from: [s, m], to: sm}

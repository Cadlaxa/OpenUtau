  - {from: [s, p], to: sp}
  - {from: [s, pp], to: sp}
  - {from: [s, t], to: st}
  - {from: [s, tt], to: st}
  - {from: vf, to: "'"}
  - {from: q, to: "・"}

#Contextual ax
  - {from: "@", to: V}
  - {from: ["@", n], to: [I, n]}
  - {from: ["@", m], to: [I, m]}
  - {from: ["@", ng], to: [I, ng]}
  - {from: ["@", l], to: [oU, l]}
  - {from: ["@", s], to: [I, s]}
  - {from: ["@", d], to: [I, d]}
  - {from: ["@", t], to: [I, t]}
  - {from: ["@", j], to: [I, j]}
  - {from: ["@", ch], to: [If, ch]}

#dr/tr
  - {from: dr, to: [d, R]}
  - {from: tr, to: [t, R]}

#Palatized h
  - {from: [h, i], to: [C, i]}
  - {from: [h, y], to: [C, y]}

#American Vowel(the phonemes[{], [eI] to [m],[n],[ng], and[ん])
  - {from: ["{", m], to: [e, a^, m]}
  - {from: ["{", n], to: [e, a^, n]}
  - {from: ["{", ng], to: [eI, ng]}
  - {from: ["{", ng, k], to: [eI, n, k]}
  - {from: ["{", ん], to: [e, a^, ん]}
#the phonemes [eIR], and [eI, R] in the same note
  - {from: eIR, to: [e, R]}
  - {from: [eI, R], to: [e, R]}


replacements:
#split diphthongs and rhotics
  - {from: [I, r], to: [I, I@^, '@r']}
  - {from: [e, r], to: [e, e@^, '@r']}
  - {from: [u:, r], to: [u:, U@^, '@r']}
  - {from: [Q, r], to: [Q, Q@^, '@r']}
  - {from: [O:, r], to: [O:, O@^, '@r']}
  - {from: eI, to: [e, eI^, 'i:']}
  - {from: aI, to: [V, aI^, 'i:']}
  - {from: OI, to: [O:, OI^, 'i:']}
  - {from: '@U', to: [Q, '@U^', 'u:']}
  - {from: aU, to: ['{', aU^, 'u:']}
  - {from: I@, to: [I, I@^, '@r']}
  - {from: e@, to: [e, e@^, '@r']}
  - {from: U@, to: [u:, U@^, '@r']}
  - {from: Q@, to: [Q, Q@^, '@r']}
  - {from: O@, to: [O:, O@^, '@r']}

fallbacks:
  - {from: 'eI^i:', to: eI}
  - {from: 'aI^i:', to: aI}
  - {from: 'OI^i:', to: OI}
  - {from: '@U^u:', to: '@U'}
  - {from: 'aU^u:', to: aU}
  - {from: 'I@^@r', to: I@}
  - {from: 'e@^@r', to: e@}
  - {from: 'U@^@r', to: U@}
  - {from: 'Q@^@r', to: Q@}
  - {from: 'O@^@r', to: O@}
  
entries:
  - grapheme: openutau
    phonemes: [ow, p, eh, n, uw, t, aa, uw]
